name: scrape

on:
  # Manual only — no schedule.
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years (e.g. 2022,2023). Empty = all years in year_ranges.json."
        required: false
        default: ""
      shards:
        description: "Comma-separated shard indices to run (0-59). Empty = all 60."
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        shell: bash
        env:
          YEARS_FILTER: ${{ github.event.inputs.years }}
          SHARDS_FILTER: ${{ github.event.inputs.shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os, sys
          MAX_MATRIX = 256  # hard GitHub Actions limit per job
          ranges = json.load(open("year_ranges.json"))
          years_filter = os.environ.get("YEARS_FILTER", "").strip()
          shards_filter = os.environ.get("SHARDS_FILTER", "").strip()
          allowed_years = [y for y in sorted(ranges, key=int)
                           if not years_filter or y in {p.strip() for p in years_filter.split(",") if p.strip()}]
          if not allowed_years:
              sys.exit(f"No year in year_ranges.json matches years input {years_filter!r}")
          # 60 shards/year is the target; shrink it so years * shards stays within the limit.
          shards_per_year = min(60, MAX_MATRIX // len(allowed_years))
          if shards_per_year < 1:
              sys.exit(f"{len(allowed_years)} years cannot fit in {MAX_MATRIX} configurations; pass fewer years.")
          shard_ids = ([int(x) for x in shards_filter.split(",") if x.strip()]
                       if shards_filter else list(range(shards_per_year)))
          bad = [s for s in shard_ids if not 0 <= s < shards_per_year]
          if bad:
              sys.exit(f"shards {bad} out of range: this run has {shards_per_year} shards/year (0-{shards_per_year - 1}).")
          matrix = []
          for year in allowed_years:
              lo, hi = ranges[year]
              size = math.ceil((hi - lo + 1) / shards_per_year)
              for s in shard_ids:
                  start = lo + s * size
                  end = min(start + size - 1, hi)
                  if start > hi:
                      continue
                  matrix.append({"year": year, "shard": s, "start": start, "end": end})
          if len(matrix) > MAX_MATRIX:
              sys.exit(f"matrix has {len(matrix)} configurations, over the {MAX_MATRIX} limit.")
          print(f"shards_per_year={shards_per_year}", file=sys.stderr)
          print(f"matrix={json.dumps(matrix)}")
          PY

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      DOC_TARGET_URL: ${{ secrets.DOC_TARGET_URL }}
      # Not a secret: as a secret its value ("7") is masked everywhere in the
      # logs, redacting every digit 7 in IDs, error codes and timestamps.
      DOC_ID_ZERO_PADDING: ${{ vars.DOC_ID_ZERO_PADDING || '7' }}
      DOC_ID_FIELD_SELECTOR: ${{ secrets.DOC_ID_FIELD_SELECTOR }}
      DOC_CAPTCHA_FIELD_SELECTOR: ${{ secrets.DOC_CAPTCHA_FIELD_SELECTOR }}
      DOC_SUBMIT_BUTTON_SELECTOR: ${{ secrets.DOC_SUBMIT_BUTTON_SELECTOR }}
      DOC_CAPTCHA_IMG_XPATH: ${{ secrets.DOC_CAPTCHA_IMG_XPATH }}
      DOC_CAPTCHA_WRONG_MARKER: ${{ secrets.DOC_CAPTCHA_WRONG_MARKER }}
      DOC_CAPTCHA_ERROR_CLASS: ${{ secrets.DOC_CAPTCHA_ERROR_CLASS }}
      DOC_RED_MESSAGE_SELECTOR: ${{ secrets.DOC_RED_MESSAGE_SELECTOR }}
      DOC_PDF_URL_MARKER: ${{ secrets.DOC_PDF_URL_MARKER }}
      DOC_ERROR_EXPIRED_MARKER: ${{ secrets.DOC_ERROR_EXPIRED_MARKER }}
      DOC_ERROR_REPLACED_MARKER: ${{ secrets.DOC_ERROR_REPLACED_MARKER }}
      DOC_ERROR_NOT_FOUND_MARKER: ${{ secrets.DOC_ERROR_NOT_FOUND_MARKER }}
      DOC_ERROR_INVALID_MARKER: ${{ secrets.DOC_ERROR_INVALID_MARKER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Download prior shard output (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shard-${{ matrix.year }}-${{ matrix.shard }}
          path: .

      - name: Run scraper for this shard
        env:
          DOC_ID_PREFIX: PRJ${{ matrix.year }}
          DOC_ID_START: ${{ matrix.start }}
          DOC_ID_END: ${{ matrix.end }}
          DOC_OUTPUT_PATH: doc_data_${{ matrix.year }}_shard_${{ matrix.shard }}.xlsx
          DOC_NUM_WORKERS: "2"
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.year }}-${{ matrix.shard }}
          path: doc_data_${{ matrix.year }}_shard_${{ matrix.shard }}.xlsx
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install openpyxl

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Merge shards per year
        shell: bash
        run: |
          if [ -z "$(ls -A shards 2>/dev/null)" ]; then
            echo "::warning::No shard artifacts to merge — skipping."
            exit 0
          fi
          for year in $(python -c "import json; print(' '.join(sorted(json.load(open('year_ranges.json')))))"); do
            count=$(ls shards/doc_data_${year}_shard_*.xlsx 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              python scripts/merge_shards.py \
                --shards-dir shards \
                --pattern "doc_data_${year}_shard_*.xlsx" \
                --output doc_data_${year}.xlsx
            fi
          done

      - name: Upload merged workbooks
        uses: actions/upload-artifact@v4
        with:
          name: doc_data_all_years
          path: doc_data_*.xlsx
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
